[project]
name = "oracle-sentinel-backend"
version = "0.1.0"
requires-python = ">=3.14"
description = "Oracle Sentinel AI - Central Oracle Database Monitoring Platform"
dependencies = [
    "fastapi>=0.118.3",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "oracledb>=3.3.0",
    "python-dotenv>=1.0",
    "cryptography>=42.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
    "mypy>=1.11",
    "pytest-mock>=3.12",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.14"
strict = true
